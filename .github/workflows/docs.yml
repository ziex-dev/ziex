name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
      - 'src/runtime/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build_ssg:
    runs-on: ubuntu-latest
    name: Build (SSG)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-size-limit: 0
          use-tool-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-inter \
            fonts-croscore

      - name: Install Node Dependencies
        run: cd site && npm ci

      - name: Build Site
        run: cd site && zig build zx -- export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/dist

  pre_deploy:
    name: Pre-deploy
    uses: ./.github/workflows/e2e.yml
    with:
      report_name: playwright-report-pre-deploy

  deploy_ssg:
    environment:
      name: github-pages
      url: ${{ steps.url.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build_ssg, pre_deploy]
    name: Deploy (SSG)
    outputs:
      page_url: ${{ steps.url.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Normalize page URL
        id: url
        run: |
          raw='${{ steps.deployment.outputs.page_url }}'
          url="${raw%/}"
          case "$url" in
            http://*) url="https://${url#http://}" ;;
          esac
          echo "page_url=$url" >> "$GITHUB_OUTPUT"

  post_deploy:
    name: Post-deploy
    needs: [deploy_ssg, deploy_edge]
    uses: ./.github/workflows/e2e.yml
    with:
      base_url: ${{ needs.deploy_ssg.outputs.page_url }}
      report_name: playwright-report-post-deploy

  build_ssr:
    runs-on: ubuntu-24.04-arm
    name: Build (SSR)
    env:
      BUILD_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./site/Dockerfile
          tags: ziex:latest
          outputs: type=docker,dest=/tmp/image-${{ env.BUILD_ARCH }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.BUILD_ARCH }}
          path: /tmp/image-${{ env.BUILD_ARCH }}.tar
          retention-days: 1

  # Temp disable ssr build
  deploy_ssr:
    environment:
      name: ssr
      url: https://ziex.dev
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    name: Deploy (SSR)
    needs: [pre_deploy, build_ssr]
    steps:

    - name: Dummy step
      run: echo "SSR deployment is temporarily disabled while we set up Dokploy"

      # Now the compose is built and run by Dokploy
      # we can think of invoking Dokploy webhook from here instead in the future

