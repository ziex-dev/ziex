name: IDE - VSCode

on:
  push:
    branches:
      - main
    paths:
      - 'ide/vscode/**'
      - 'pkg/plugin-esbuild/**'
      - 'pkg/plugin-system/**'
      - '.github/workflows/vscode.yml'

  release:
    types: [created]

  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: false
        type: string
      publish:
        description: "Publish"
        required: false
        type: boolean
        default: true
      pre-release:
        description: "Pre-release"
        required: false
        type: boolean
        default: true
      from:
        description: "Version from"
        required: false
        type: choice
        default: commits
        options:
          - commits
          - tag

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pre_release: ${{ steps.version.outputs.pre_release }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json

      - name: Install dependencies
        working-directory: ide/vscode
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          to_vscode_version() {
            local raw="${1#v}"
            # Already marketplace-safe X.Y.Z (e.g. 0.1.1234)
            if echo "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "$raw"
              return
            fi
            # Map 0.1.0-dev.N (+meta) -> 0.1.N (VS Code rejects prerelease tags)
            local n
            n=$(echo "${raw%%+*}" | grep -oE '[a-zA-Z]+\.([0-9]+)$' | grep -oE '[0-9]+$' || true)
            if [ -n "$n" ]; then
              echo "0.1.$n"
              return
            fi
            echo "::error::Cannot map version '$1' to VS Code format 0.1.N" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            FROM="commits"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              FROM="${{ inputs.from || 'commits' }}"
            fi
            RAW=$(bash tools/version --resolve --from="$FROM")
            echo "Resolved monorepo version from --from=$FROM: $RAW"
          fi

          VERSION=$(to_vscode_version "$RAW")
          echo "VS Code extension version: $VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PRE_RELEASE="${{ inputs.pre-release }}"
          elif [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.prerelease }}" != "true" ]; then
            PRE_RELEASE="false"
          else
            # push to main and prerelease GitHub releases → marketplace pre-release
            PRE_RELEASE="true"
          fi

          sed -i -E "s/\"version\": \"[0-9]+\\.[0-9]+\\.[0-9]+\"/\"version\": \"$VERSION\"/" ide/vscode/package.json
          echo "Stamped ide/vscode/package.json -> $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pre_release=$PRE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "vsix=ziex-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Pack
        working-directory: ide/vscode
        env:
          PRE_RELEASE: ${{ steps.version.outputs.pre_release }}
        run: |
          if [ "$PRE_RELEASE" = "true" ]; then
            zig build pre-release -Doptimize=ReleaseSafe
          else
            zig build pack -Doptimize=ReleaseSafe -Dpre-release=false
          fi

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: ide/vscode/${{ steps.version.outputs.vsix }}
          retention-days: 14

  publish-vscode:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: .

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRE_RELEASE: ${{ needs.build.outputs.pre_release }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set"
            exit 1
          fi
          ls -la "$VSIX"
          ARGS=(publish --packagePath "$VSIX" --skip-duplicate -p "$VSCE_PAT")
          if [ "$PRE_RELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx --yes @vscode/vsce "${ARGS[@]}"

  publish-open-vsx:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: vscode-marketplace
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: .

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          PRE_RELEASE: ${{ needs.build.outputs.pre_release }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OPEN_VSX_TOKEN secret is not set; skipping Open VSX publish"
            exit 0
          fi
          ARGS=(publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate)
          if [ "$PRE_RELEASE" = "true" ]; then
            ARGS+=(--pre-release)
          fi
          npx --yes ovsx "${ARGS[@]}"
